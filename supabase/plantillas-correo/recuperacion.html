<!-- Supabase → Authentication → Emails → "Reset password"
     Asunto: Crea tu contraseña de SaludXpert
     También lo usa el botón "Reenviar enlace" del panel de administración. -->
<div style="margin:0;padding:24px 12px;background:#edf4fc;font-family:Arial,Helvetica,sans-serif;color:#14273d;">
  <div style="max-width:480px;margin:0 auto;padding:32px 28px;background:#ffffff;border-radius:16px;">
    <img src="https://salud-xpert.vercel.app/assets/brand/saludxpert-mark.png" alt="SaludXpert" width="56" height="56" style="display:block;margin:0 auto 16px;">
    <h1 style="margin:0 0 12px;font-size:22px;text-align:center;">Crea tu contraseña</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.55;text-align:center;">
      Recibimos una solicitud para crear o cambiar la contraseña de tu cuenta
      en SaludXpert, del Centro de Salud de Salcajá.
    </p>
    <p style="margin:0 0 20px;text-align:center;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;background:#0b66dc;color:#ffffff;text-decoration:none;font-weight:bold;border-radius:999px;">Crear contraseña</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#5f6e83;text-align:center;">
      El enlace sirve una sola vez y vence en 24 horas.
    </p>
  </div>
  <p style="max-width:480px;margin:16px auto 0;font-size:12px;color:#5f6e83;text-align:center;">
    Si no pediste este cambio, ignora este correo: tu contraseña actual sigue funcionando.
  </p>
</div>
