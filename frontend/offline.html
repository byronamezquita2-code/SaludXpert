<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — SaludXpert</title>
<link rel="icon" type="image/png" href="assets/brand/saludxpert-mark.png">
<style>
  :root { color-scheme: light dark; --fondo: #edf4fc; --texto: #14273d; --suave: #5f6e83; --boton: #0b66dc; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #05070b; --texto: #eaf2ff; --suave: #a9b7c9; } }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--fondo);
    color: var(--texto);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  main { max-width: 380px; }
  img { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { margin: 0 0 10px; font-size: 1.4rem; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: var(--suave); line-height: 1.55; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: var(--boton);
    color: #fff;
    font-weight: 650;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img src="assets/brand/saludxpert-mark.png" alt="SaludXpert">
    <h1>Sin conexión</h1>
    <p>SaludXpert necesita internet para consultar pacientes y diagnósticos. Revisa tu conexión e intenta de nuevo.</p>
    <a href="./">Reintentar</a>
  </main>
</body>
</html>
